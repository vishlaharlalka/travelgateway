<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Gateway Business Card Preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef2f0;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(92vw, 1200px);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(7, 17, 31, 0.18);
      }

      p {
        margin: 18px 0 0;
        color: #425466;
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./travel-gateway-business-card.svg" alt="Travel Gateway business card front and back" />
      <p>Front and back design. Export each card at 3.5 x 2 in with 0.125 in bleed for print.</p>
    </main>
  </body>
</html>
